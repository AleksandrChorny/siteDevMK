
   <!-- модальне вікно створення параметра секції -->
   <div class="modal-window _view" data-name="section-create-param-menu">
      <!-- форма створення параметра секції -->
      <div class="edit-form moderation-menu__edit-form _action" title="add php view" data-name="create-section-param-form">
         <div class="modal-window__header">
            <!-- кнопка закриття вікна створення параметра секції -->
            <button class="close-btn" type="button" data-name="close-section-create-param-menu"></button>
            <p class="edit-form__title">create section param</p>
         </div>
         
         <!-- поле створення назви параметра -->
         <label for="s-m-p-create-name" class="edit-form__param-label">Назва елементу</label>
         <input id="s-m-p-create-name" class="edit-form__param-input" type="text" name="param-name">

         <label for="s-m-p-create-value" class="edit-form__param-label">Значення елементу</label>

         <input type="hidden" name="section_id" value="1">

         <button class="edit-form__submit" type="submit">OK</button>
