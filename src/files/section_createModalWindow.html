<div class="modal-window _view" data-name="section-create-menu">
   
    <form class="content-container" action="/setup/section/create/" title="create-section" method="post"
    enctype="multipart/form-data" data-name="section-create-form">
        <!-- Блок з кнопкою закриття та заголовком модалки -->
        <div class="content-container__header">
            <!-- кнопка закриття вікна створення параметра секції -->
            <button class="close-btn" type="button" data-close-modal="section-create-menu"></button>
            <!-- Заголовок модального вікна -->
            <p class="content-container__title">Створіть нову секцію</p>
        </div>

        <!-- поле зміни назви секції -->
        <span class="section-settings-modal__span">Тут ви можете ввести назву секції</span>
        <input class="section-settings-modal__section-name-input" type="text" name="section name">
        <!-- завантаження титульного малюну (preview) секції -->
        <span class="section-settings-modal__span">Тут ви можете завантажте зображення для прев'ю секції</span>
        <input class="section-settings-modal__section-preview-input" id="create-section-menu-preview" name="section_preview" type="file" accept="image/*">
        <label class="section-settings-modal__section-preview-label" for="create-section-menu-preview">
            Обрати зображення
            <img class="section-settings-modal__ico_img" src="/img/icons/img.png" alt="upload section preview">
        </label>
        <!-- кнопка збереження/відправки налаштувань -->
        <input class="section-settings-modal__submit" type="submit" value="Зберегти">
    </form>
</div>
